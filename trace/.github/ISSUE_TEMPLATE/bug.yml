name: Bug report
description: Report incorrect behavior in crash ingestion, analysis, or delivery.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Trace. Never include device keys, private endpoints, customer memory, or exploit details here. Use private vulnerability reporting for sensitive reports.
  - type: input
    id: version
    attributes:
      label: Trace version or commit
      placeholder: v0.5.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Crash ingestion
        - Symbolication
        - Analysis pipeline
        - Anomaly detection
        - Web UI
        - API
        - Auth / SSO
        - Billing
        - Webhooks
        - Database / migrations
        - Docker / Helm
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed result and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List exact commands, configuration, and steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs, screenshots, or stack traces only after removing identifiers and sensitive data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same behavior.
          required: true
        - label: This report contains no secrets, customer memory, or private firmware.
          required: true
