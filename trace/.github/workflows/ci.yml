name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trace -d trace"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match current stdlib security patches (govulncheck).
          go-version: "1.26.x"
      - name: Vet
        run: go vet ./...
      - name: Protocol LEP goldens (vendored)
        run: go test ./internal/lep -run TestProtocolVectors -count=1 -v
      - name: Test
        env:
          TRACE_DATABASE_URL: postgres://trace:trace@localhost:5432/trace?sslmode=disable
        run: go test ./... -count=1
      - name: Race (broad)
        env:
          TRACE_DATABASE_URL: postgres://trace:trace@localhost:5432/trace?sslmode=disable
        run: >
          go test -race -count=1
          ./internal/batch ./internal/lep ./internal/auth ./internal/webhook
          ./internal/fingerprint ./internal/queue ./internal/decode ./internal/analysis
          ./internal/config ./internal/objects ./internal/protocol ./internal/metrics
          ./internal/oidc ./internal/notify ./internal/api
      - name: Integration (postgres)
        env:
          TRACE_DATABASE_URL: postgres://trace:trace@localhost:5432/trace?sslmode=disable
        run: go test ./internal/store ./internal/api ./internal/worker -count=1 -timeout 180s
      - name: Build
        run: go build -o /tmp/trace ./cmd/trace
      - name: E2E ingest→process (in-process)
        env:
          TRACE_DATABASE_URL: postgres://trace:trace@localhost:5432/trace?sslmode=disable
        run: go test ./internal/worker -run 'TestProcess' -count=1 -timeout 120s -v
      - name: Start Trace for live e2e
        env:
          # Dedicated DB so bootstrap writes a fresh ingest token (unit tests
          # already bootstrapped the default "trace" database).
          TRACE_DATABASE_URL: postgres://trace:trace@localhost:5432/trace_e2e?sslmode=disable
          TRACE_OBJECT_DIR: ${{ runner.temp }}/trace-e2e/objects
          TRACE_LISTEN: "127.0.0.1:18080"
          TRACE_QUEUE: postgres
          TRACE_BOOTSTRAP: "true"
          TRACE_OPEN_UI: "false"
        run: |
          set -euo pipefail
          # Create isolated database via the service container
          docker run --rm --network host -e PGPASSWORD=trace postgres:16-alpine \
            psql -h 127.0.0.1 -U trace -d postgres \
            -c "DROP DATABASE IF EXISTS trace_e2e;" \
            -c "CREATE DATABASE trace_e2e;"
          mkdir -p "${TRACE_OBJECT_DIR}"
          /tmp/trace > "${{ runner.temp }}/trace-e2e.log" 2>&1 &
          echo $! > "${{ runner.temp }}/trace-e2e.pid"
          ready=0
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:18080/health/ready" >/dev/null; then
              ready=1
              echo "trace ready"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "trace failed to become ready" >&2
            tail -n 100 "${{ runner.temp }}/trace-e2e.log" || true
            exit 1
          fi
          token_file="${{ runner.temp }}/trace-e2e/bootstrap-token.txt"
          if [ ! -f "$token_file" ]; then
            echo "missing bootstrap token at $token_file" >&2
            tail -n 100 "${{ runner.temp }}/trace-e2e.log" || true
            ls -la "${{ runner.temp }}/trace-e2e/" || true
            exit 1
          fi
          echo "TRACE_E2E_TOKEN=$(tr -d '\n\r' < "$token_file")" >> "$GITHUB_ENV"
          echo "TRACE_E2E_URL=http://127.0.0.1:18080" >> "$GITHUB_ENV"
      - name: E2E Relay contract (live Trace)
        # Contract checks from the Relay client perspective (ingest headers +
        # duplicate/conflict). Cross-repo checkout of private laststate/relay is
        # not available with the default GITHUB_TOKEN.
        run: go test -tags=e2e ./scripts -count=1 -timeout 120s -v
      - name: Stop Trace
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/trace-e2e.pid" ]; then kill "$(cat "${{ runner.temp }}/trace-e2e.pid")" || true; fi
          if [ -f "${{ runner.temp }}/trace-e2e.log" ]; then tail -n 80 "${{ runner.temp }}/trace-e2e.log" || true; fi
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          npm run test:e2e
