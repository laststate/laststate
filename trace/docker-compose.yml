services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/trace || true;
      exit 0;
      "

  # API process (no workers) — scale independently
  trace-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      TRACE_LISTEN: ":8080"
      TRACE_PUBLIC_URL: "http://localhost:8080"
      # NOTE: sslmode=disable is insecure for production. Use sslmode=verify-full with proper TLS in production.
      TRACE_DATABASE_URL: "postgres://trace:trace@db:5432/trace?sslmode=disable"
      TRACE_OBJECT_DIR: "/data/objects"
      TRACE_WEB_DIR: "/app/web/dist"
      TRACE_BOOTSTRAP: "true"
      TRACE_MODE: "api"
      TRACE_WORKERS: "0"
      # Secure defaults: require login for UI APIs
      TRACE_OPEN_UI: "false"
      TRACE_ADMIN_EMAIL: "admin@localhost"
      # Empty password = auto-generate strong secret to /data/bootstrap-admin.txt
      TRACE_ADMIN_PASSWORD: ""
      TRACE_ENV: "dev"
      TRACE_ENABLE_RETENTION: "true"
      TRACE_RETENTION_DAYS: "90"
      TRACE_S3_ENDPOINT: "http://minio:9000"
      TRACE_S3_BUCKET: "trace"
      TRACE_S3_REGION: "us-east-1"
      TRACE_S3_ACCESS_KEY: "minio"
      TRACE_S3_SECRET_KEY: "minio12345"
    volumes:
      - tracedata:/data
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully

  # Worker process — process_event / notify_issue
  trace-worker:
    build: .
    environment:
      # NOTE: sslmode=disable is insecure for production. Use sslmode=verify-full with proper TLS in production.
      TRACE_DATABASE_URL: "postgres://trace:trace@db:5432/trace?sslmode=disable"
      TRACE_OBJECT_DIR: "/data/objects"
      TRACE_MODE: "worker"
      TRACE_WORKERS: "2"
      TRACE_BOOTSTRAP: "false"
      TRACE_ENABLE_RETENTION: "true"
      TRACE_RETENTION_DAYS: "90"
      TRACE_S3_ENDPOINT: "http://minio:9000"
      TRACE_S3_BUCKET: "trace"
      TRACE_S3_REGION: "us-east-1"
      TRACE_S3_ACCESS_KEY: "minio"
      TRACE_S3_SECRET_KEY: "minio12345"
    volumes:
      - tracedata:/data
    depends_on:
      db:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
      trace-api:
        condition: service_started

volumes:
  pgdata:
  tracedata:
  miniodata:
