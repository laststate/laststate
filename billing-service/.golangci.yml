version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Blank assignments (e.g. `_, _ =`) are intentional ignores.
      check-blank: false
      # Benign unchecked return: JSON encoding into an HTTP response writer.
      # Genuine error paths are handled explicitly in business code.
      exclude-functions:
        - (*encoding/json.Encoder).Encode
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - govet
      # Dunning notification targets (email/SMS service URLs) come from
      # operator configuration and environment, never from request payloads.
      - linters:
          - gosec
        text: "G704:"
      # Unhandled-error coverage is errcheck's job (enabled above with a
      # stricter policy); G104 would only duplicate it on cleanup paths.
      - linters:
          - gosec
        text: "G104:"
      # BILLING_PRICING_CONFIG points at an operator-provided pricing file.
      - linters:
          - gosec
        text: "G304:"
      - linters:
          - gosec
        text: "G703:"
      # Close on HTTP response bodies and SQL rows in cleanup paths: nothing
      # to do with the error at that point in the request lifecycle.
      - linters:
          - errcheck
        source: "^\\s*(defer )?_? ?=?.*\\.(Close)\\(\\)$"
      - linters:
          - errcheck
        text: "Error return value of `(resp.Body|.r.Body|rows|db)\\.Close` is not checked"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/laststate/billing-service

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
