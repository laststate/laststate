name: Chore
description: Maintenance tasks, dependency updates, CI/CD improvements.
title: "[Chore]: "
labels:
  - chore
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Use this template for maintenance tasks.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Dependency update
        - CI/CD improvement
        - Documentation
        - Code cleanup
        - Build system
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context or references.
