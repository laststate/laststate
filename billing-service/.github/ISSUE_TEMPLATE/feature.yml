name: Feature request
description: Propose a new billing feature or enhancement.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Billing Service!
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this feature work? Include examples if possible.
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affects provider(s)
      multiple: true
      options:
        - Stripe
        - Mercado Pago
        - Crypto
        - All providers
        - Provider-agnostic
    validations:
      required: true
  - type: textarea
    id: billing_impact
    attributes:
      label: Billing impact
      description: How does this affect pricing, invoicing, or subscriptions?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, or references.
