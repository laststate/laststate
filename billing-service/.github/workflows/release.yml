name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate semver tag and CHANGELOG entry
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Tag $TAG is not a valid semver version"
            exit 1
          fi
          version="${TAG#v}"
          if ! grep -q "## \[${version}\]" CHANGELOG.md; then
            echo "Tag $TAG has no corresponding CHANGELOG entry" >&2
            exit 1
          fi

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, suffix: linux-amd64 }
          - { os: ubuntu-latest, goos: linux, goarch: arm64, suffix: linux-arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64, suffix: windows-amd64.exe }
          - { os: macos-latest, goos: darwin, goarch: amd64, suffix: darwin-amd64 }
          - { os: macos-latest, goos: darwin, goarch: arm64, suffix: darwin-arm64 }
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.target.suffix }}
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.target.goos }} GOARCH=${{ matrix.target.goarch }} \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/billing-service-${{ matrix.target.suffix }} ./cmd/billing-service
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: billing-service-${{ matrix.target.suffix }}
          path: dist/billing-service-${{ matrix.target.suffix }}
          if-no-files-found: error

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/laststate/billing-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  helm:
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Login to GHCR (OCI)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push chart
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/billing-service --version "$version" --app-version "$version" -d dist
          helm push "dist/billing-service-${version}.tgz" oci://ghcr.io/laststate/charts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: billing-service-helm
          path: dist/billing-service-*.tgz
          if-no-files-found: error

  publish:
    needs: [build, docker, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: billing-service-*
          path: dist/
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 -- * 2>/dev/null || sha256sum -- *
          shasum -a 256 -- * > checksums.sha256
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/billing-service-linux-amd64
            dist/billing-service-linux-arm64
            dist/billing-service-windows-amd64.exe
            dist/billing-service-darwin-amd64
            dist/billing-service-darwin-arm64
            dist/billing-service-*.tgz
            dist/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
