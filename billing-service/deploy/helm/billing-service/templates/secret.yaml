apiVersion: v1
kind: Secret
metadata:
  name: {{ include "billing-service.fullname" . }}-secret
  labels:
    {{- include "billing-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ .Values.config.dbURL | quote }}
  STRIPE_KEY: {{ .Values.config.stripeKey | quote }}
  MP_KEY: {{ .Values.config.mpKey | quote }}
  CRYPTO_KEY: {{ .Values.config.cryptoKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.config.stripeWebhookSecret | quote }}
  MP_WEBHOOK_SECRET: {{ .Values.config.mpWebhookSecret | quote }}
  CRYPTO_WEBHOOK_SECRET: {{ .Values.config.cryptoWebhookSecret | quote }}
