delivery:
  - changed-files:
      - any-glob-to-any-file: ['internal/delivery/**']
spool:
  - changed-files:
      - any-glob-to-any-file: ['internal/spool/**', 'migrations/**']
admin:
  - changed-files:
      - any-glob-to-any-file: ['internal/admin/**']
