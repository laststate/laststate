name: SBOM
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install syft
        shell: bash
        run: |
          curl -sSfL https://github.com/anchore/syft/releases/download/v1.18.0/syft_1.18.0_linux_amd64.tar.gz | \
            tar xz -C /usr/local/bin syft
      - name: Generate SBOMs
        shell: bash
        run: |
          syft dir:. --quiet --output spdx-json=sbom.spdx.json
          syft dir:. --quiet --output cyclonedx-json=sbom.cdx.json
      - name: Validate SBOM files
        shell: bash
        run: |
          test -s sbom.spdx.json || { echo "sbom.spdx.json is missing or empty" >&2; exit 1; }
          test -s sbom.cdx.json  || { echo "sbom.cdx.json  is missing or empty" >&2; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
          if-no-files-found: error
      - name: Upload SBOM to GHCR package
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          echo "SBOM upload to GHCR is available on demand via workflow_dispatch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
